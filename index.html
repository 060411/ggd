<!DOCTYPE html>
<html lang="zh-CN">

<head>
<meta charset="UTF-8">
<title>在线注册表单</title>

<style>

/* 页面背景 */
body{
    font-family:"Microsoft YaHei";
    background:linear-gradient(135deg,#74ebd5,#9face6);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* 表单卡片 */
.container{
    width:420px;
    background:white;
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* 标题 */
h2{
    text-align:center;
    margin-bottom:25px;
    color:#333;
}

/* 每一行 */
.form-item{
    margin-bottom:18px;
}

/* 标签 */
label{
    display:inline-block;
    width:80px;
    font-weight:bold;
}

/* 输入框 */
/* CSS控制输入框长度 */
input{
    width:220px;
    height:32px;
    border-radius:6px;
    border:1px solid #ccc;
    padding-left:10px;
    transition:0.3s;
}

/* 输入框获取焦点 */
input:focus{
    border-color:#5aa9ff;
    box-shadow:0 0 5px rgba(90,169,255,0.5);
    outline:none;
}

/* 错误提示 */
.error{
    color:red;
    font-size:12px;
    margin-left:85px;
}

/* 按钮区域 */
.btn-group{
    margin-left:85px;
    margin-top:10px;
}

/* 按钮 */
button{
    width:90px;
    height:35px;
    border:none;
    border-radius:6px;
    margin-right:10px;
    cursor:pointer;
    font-size:14px;
}

/* 提交按钮 */
.submit{
    background:#5aa9ff;
    color:white;
}

/* 重置按钮 */
.reset{
    background:#ccc;
}

/* 按钮悬停 */
button:hover{
    opacity:0.85;
}

</style>
</head>

<body>

<div class="container">

<h2>用户注册</h2>

<form id="form">

<div class="form-item">
<label>用户名</label>
<input type="text" id="username">
<div class="error" id="userError"></div>
</div>

<div class="form-item">
<label>密码</label>
<input type="password" id="password">
<div class="error" id="passError"></div>
</div>

<div class="form-item">
<label>邮箱</label>
<input type="text" id="email">
<div class="error" id="emailError"></div>
</div>

<div class="form-item">
<label>电话</label>
<input type="text" id="phone">
<div class="error" id="phoneError"></div>
</div>

<div class="btn-group">
<button type="submit" class="submit">提交</button>
<button type="reset" class="reset">重置</button>
</div>

</form>

</div>

<script>

document.getElementById("form").onsubmit=function(e){

var username=document.getElementById("username").value.trim();
var password=document.getElementById("password").value.trim();
var email=document.getElementById("email").value.trim();
var phone=document.getElementById("phone").value.trim();

var emailReg=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
var phoneReg=/^1[3-9]\d{9}$/;

/* 清空提示 */
document.getElementById("userError").innerText="";
document.getElementById("passError").innerText="";
document.getElementById("emailError").innerText="";
document.getElementById("phoneError").innerText="";

/* 用户名 */
if(username==""){
document.getElementById("userError").innerText="用户名不能为空";
e.preventDefault();
return;
}

/* 密码 */
if(password==""){
document.getElementById("passError").innerText="密码不能为空";
e.preventDefault();
return;
}

/* 邮箱 */
if(!emailReg.test(email)){
document.getElementById("emailError").innerText="邮箱格式不正确";
e.preventDefault();
return;
}

/* 电话 */
if(!phoneReg.test(phone)){
document.getElementById("phoneError").innerText="手机号格式不正确";
e.preventDefault();
return;
}

alert("注册成功！");

}

</script>

</body>
</html>
